<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kenya Fleet System</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f3f7fb;
        color: #1f2937;
      }
      .container {
        max-width: 760px;
        margin: 80px auto;
        background: #ffffff;
        padding: 32px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin-top: 0;
        color: #0f172a;
      }
      .badge {
        display: inline-block;
        background: #dcfce7;
        color: #166534;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      p {
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">Live Fleet Monitoring</div>
      <h1>Kenya Fleet System</h1>
      <p>
        This application is for checking fuel requests, validating allowances, and sending
        driver alerts for fleet operations across Kenya.
      </p>
      <p>
        The API is available at <strong>/api/fuel-check</strong> for fleet data validation.
      </p>
    </div>
  </body>
</html>
